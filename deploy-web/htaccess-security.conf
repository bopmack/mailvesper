# BEGIN MailVesper security headers (managed in the MailVesper repo: deploy-web/htaccess-security.conf)
<IfModule mod_headers.c>
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Strict-Transport-Security "max-age=31536000"
  Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
  # Static pages only (the API under /api sets its own headers). No inline or third-party script may run.
  <FilesMatch "\.html$">
    # Pages are small and point at versioned scripts (?v=): always check for a newer page, so an update shows at once.
    Header always set Cache-Control "no-cache"
    Header always set __CSP_HEADER__ "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
  </FilesMatch>
</IfModule>
# END MailVesper security headers
